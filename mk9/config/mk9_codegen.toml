0x82E54080 = { end = 0x82E54110 }
0x82E6F378 = { end = 0x82E6F400 }
0x82E6F490 = { end = 0x82E6F518 }

# XAPI fibers: the game's latent-action scheduler (list head 0x834246BC, run by sub_829D06C8)
# switches into fibers. The SDK implements these on host fibers.
# 0x82BDC380 is SwitchToFiber's entry (a branch into the register save at 0x82BDCC80).
[rexcrt]
ConvertThreadToFiber = 0x82BDC240
ConvertFiberToThread = 0x82BDC2D0
DeleteFiber = 0x82BDC320
SwitchToFiber = 0x82BDC380
