# Codegen configuration for Mortal Kombat Komplete Edition (Xbox 360), default.xex
# title 575207FD, media 6579DAFA, version 0.0.0.8, built 2011-12-05 (MK9Game-Retail.exe).
# Every address below is for that executable only.

# Leaf functions without .pdata entries that are only reached by tail branches (b), so the
# scanner does not find them on its own.
[functions]
0x8240AA80 = { end = 0x8240AAAC }   # tail target of 0x8246FA88
0x82AC5140 = { end = 0x82AC5148 }   # lwz r3,0x4C(r3); blr
0x82780F40 = { end = 0x82780F48 }   # lwz r3,0x80(r3); blr
0x82AE9130 = { end = 0x82AE91C4 }
0x830179C0 = { end = 0x83017A3C }
0x82F6A238 = { end = 0x82F6A2A8 }
# property getters whose case blocks the scanner split into pieces
0x82E54080 = { end = 0x82E54110 }
0x82E6F378 = { end = 0x82E6F400 }
0x82E6F490 = { end = 0x82E6F518 }

# XAPI fibers: the game's latent-action scheduler (list head 0x834246BC, run by sub_829D06C8)
# switches into fibers. The SDK implements these on host fibers.
# 0x82BDC380 is SwitchToFiber's entry (a branch into the register save at 0x82BDCC80).
[rexcrt]
ConvertThreadToFiber = 0x82BDC240
ConvertFiberToThread = 0x82BDC2D0
DeleteFiber = 0x82BDC320
SwitchToFiber = 0x82BDC380

# Checks inserted into the game's code (mk9/src/mk9/guards.cpp): where its own code went on through a
# pointer that can be empty here and crashed, the function's own way out instead.
# sub_82A30C20, a script command spawning an effect: none came back (every effect in use, mk9/fx.h)
[[midasm_hook]]
name = "Mk9SpawnFailed"
address = 0x82A30CC8          # cmplwi cr6,r3,0 after the spawn
registers = ["r3"]
jump_address_on_true = 0x82A30C5C   # li r3,-1: its failure exit

# sub_828E4720 spawning an effect: none came back
[[midasm_hook]]
name = "Mk9EffectMissing"
address = 0x828E4890          # lwz r10,168(r3)
registers = ["r3"]
jump_address_on_true = 0x828E4898   # it returns what it got

# sub_82A569E0, run by a rendering command: the render object's entry it sets is not there
[[midasm_hook]]
name = "Mk9RenderEntryMissing"
address = 0x82A56A10          # stw r10,32(r11)
registers = ["r11"]
return_on_true = true
